name: Build and Deploy PharmacySystem API

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar API
        run: dotnet publish PharmacySystem/PharmacySystem.Api.csproj -c Release -o ./publish

      - name: Generar appsettings.Production.json
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          $config = @{
            ConnectionStrings = @{
              DefaultConexion = $env:DB_CONNECTION_STRING
            }
          }
          $config | ConvertTo-Json -Depth 3 | Set-Content -Path "./publish/appsettings.Production.json" -Encoding UTF8

      - name: Desplegar en MonsterASP.NET
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = (Get-ChildItem "C:\Program Files*\IIS\Microsoft Web Deploy*\msdeploy.exe" | Select-Object -First 1).FullName
          }
          $sourcePath = (Resolve-Path "./publish").Path
          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="$env:WEBSITE_NAME",computerName="$env:SERVER_COMPUTER_NAME",userName="$env:SERVER_USERNAME",password="$env:SERVER_PASSWORD",authtype="Basic" `
            -enableRule:AppOffline `
            -allowUntrusted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }